[project]
name = "online-cinema-fastapi"
version = "0.1.0"
description = "Online Cinema REST API using FastAPI"
authors = [
    {name = "Max", email = "kiporenkomaks8@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard] (>=0.162.5,<0.163.0)",
    "sqlalchemy (>=2.0,<2.1)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"