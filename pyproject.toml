[project]
name = "online-cinema-fastapi"
version = "0.1.0"
description = "Online Cinema REST API using FastAPI"
authors = [
    {name = "Max", email = "kiporenkomaks8@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard] (>=0.162.5,<0.163.0)",
    "sqlalchemy (>=2.0,<2.1)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "aiosmtplib (>=5.1.3,<6.0.0)",
    "celery[redis] (>=5.7.0,<6.0.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "pyjwt (>=2.15.1,<3.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)"
]
