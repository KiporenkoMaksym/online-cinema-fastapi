services:
  db:
    image: postgres:16-alpine
    container_name: online_cinema_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: online_cinema
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_local_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema_user -d online_cinema"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
